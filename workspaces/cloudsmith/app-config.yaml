app:
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007

  csp:
    connect-src: ["'self'", 'http:', 'https:']

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

# Points the dev harness at a public Cloudsmith repository, so that
# `yarn start` shows real package versions. Any Cloudsmith API key works for
# reading public repositories.
cloudsmith:
  org: infisical
  apiKey: ${CLOUDSMITH_API_KEY}
